<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!-- QoderWork AI Slides builtin reference adapted from qoderwork-ppt/14-thank-you.html; scaled to 1280x720 and stripped of remote cover media. -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280, height=720">
  <title>Thank-You</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    .slide {
      width: 1280px;
      height: 720px;
      background-color: #000000;
      font-family: 'PingFang SC', 'Microsoft YaHei', 'PingFang TC', 'Hiragino Sans GB', sans-serif;
      position: relative;
      overflow: hidden;
    }
    .thank-you-title {
      position: absolute;
      left: 27px;
      top: 13px;
      width: 1227px;
      font-weight: 700;
      font-size: 140px;
      line-height: 1;
      letter-spacing: -0.03em;
      color: #73CD94;
    }
    .description-block {
      position: absolute;
      left: 27px;
      bottom: 27px;
      width: 474px;
      max-height: 120px;
      overflow: hidden;
    }
    .description-block [data-slot="description"] {
      font-family: 'PingFang SC', 'Microsoft YaHei', 'PingFang TC', 'Hiragino Sans GB', sans-serif;
      font-weight: 400;
      font-size: 32px;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #E1EEE6;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
      overflow: hidden;
    }
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
  </style>
</head>
<body>
  <div class="slide" data-template="thank-you">
    <h1 class="thank-you-title">Thank you!</h1>
    <div class="description-block">
      <p data-slot="description">Reach out to us if you have questions.</p>
    </div>
  </div>
</body>
</html>
