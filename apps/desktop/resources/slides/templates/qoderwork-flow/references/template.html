<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1280, height=720" />
  <title>QoderWork Flow</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; }
    body { font-family: AlibabaPuHuiTi, "PingFang SC", "Microsoft YaHei", Arial, sans-serif; }
    .slide {
      position: relative;
      width: 1280px;
      height: 720px;
      overflow: hidden;
      background: #C2EFC7;
      color: #000;
    }
    .grid { position: absolute; inset: 0; opacity: .2; background-image: linear-gradient(rgba(0,0,0,.22) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,.22) 1px, transparent 1px); background-size: 48px 48px; }
    .black { position: absolute; right: -120px; bottom: -72px; width: 760px; height: 300px; background: #000; transform: rotate(-7deg); }
    .green { position: absolute; right: 144px; bottom: 94px; width: 420px; height: 120px; background: #73CD94; transform: rotate(-7deg); }
    .frame { position: absolute; inset: 48px; border: 1px solid rgba(0,0,0,.42); }
    .kicker { position: absolute; left: 86px; top: 86px; font-size: 18px; letter-spacing: .14em; text-transform: uppercase; color: rgba(0,0,0,.58); }
    h1 { position: absolute; left: 84px; top: 146px; width: 720px; margin: 0; font-size: 82px; line-height: .96; letter-spacing: -0.04em; font-weight: 760; color: #000; }
    .desc { position: absolute; left: 86px; bottom: 86px; width: 560px; margin: 0; font-size: 22px; line-height: 1.42; color: rgba(0,0,0,.62); }
    .chip { position: absolute; right: 86px; top: 86px; padding: 10px 14px; border: 1px solid rgba(0,0,0,.52); font-size: 16px; line-height: 1; color: #000; background: rgba(255,255,255,.22); }
    .mark { position: absolute; right: 86px; bottom: 84px; display: grid; grid-template-columns: repeat(3, 32px); gap: 10px; }
    .mark i { width: 32px; height: 32px; background: #C2EFC7; border: 1px solid rgba(255,255,255,.34); }
  </style>
</head>
<body>
  <main class="slide">
    <div class="grid" aria-hidden="true"></div>
    <div class="black" aria-hidden="true"></div>
    <div class="green" aria-hidden="true"></div>
    <section class="frame" aria-hidden="true"></section>
    <div class="kicker">QoderWork AI Slides</div>
    <div class="chip">qoderwork-flow</div>
    <h1>QoderWork 原生<br>QoderWork Flow</h1>
    <p class="desc">Native green-and-black deck language for product work, launch updates, and technical storytelling.</p>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
  </main>
</body>
</html>
