# Cortex Desktop 打包 / 发布配置（electron-builder）。
# 自动更新走 GitHub Releases:electron-updater 读取打包时生成的
# app-update.yml（来自下方 publish 字段）,对比 release 里的 latest-mac.yml。
#
# ⚠️ 发布前必改:把 publish.owner 换成你的 GitHub 用户名/组织,并确保
#   该 repo 存在。发版流程:更新 package.json version → pnpm dist →
#   把 dist/ 里的 dmg、zip、latest-mac.yml 一起传到 GitHub Release（tag v<version>）。
# ⚠️ macOS 自动更新要求应用正式签名(Developer ID);未签名时 electron-updater
#   会在下载/校验阶段报错,只能手动替换安装。
appId: ai.cortex.work
productName: Cortex Desktop
directories:
  output: dist
files:
  - out/**
  - assets/**
  - package.json
# node-pty 原生模块不能进 asar
asarUnpack:
  - "**/node_modules/node-pty/**"
  # pi（@earendil-works/pi-coding-agent）由 ELECTRON_RUN_AS_NODE 子进程执行,
  # 入口 cli.js 必须是真实文件路径（pi-locate.ts 在打包态切换到 app.asar.unpacked）。
  # 其余依赖（undici/jiti/photon wasm 等）留在 asar 即可:Electron 的 Node 模式
  # 自带 asar 感知的 fs/ESM 加载,已用打包产物实测完整 agent 回路通过。
  # 注意:electron-builder 打包时会把 pnpm 的 node_modules 拍平,产物里没有 .pnpm
  # 目录,glob 不要写 .pnpm 形式（匹配不到）。@mariozechner/clipboard 的 NAPI
  # 原生模块由 electron-builder 自动 unpack,无需显式列出。
  - "**/node_modules/@earendil-works/**"
mac:
  category: public.app-category.productivity
  icon: assets/cortex-desktop-logo-minimal.png
  target:
    # 自动更新走 zip,人工分发用 dmg
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]
publish:
  provider: github
  owner: OWNER_PLACEHOLDER # TODO: 改成真实 GitHub 用户名/组织
  repo: cortex-work
