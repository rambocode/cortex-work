# Cortex Desktop 打包 / 发布配置（electron-builder）。
# 自动更新走 GitHub Releases:electron-updater 读取打包时生成的
# app-update.yml（来自下方 publish 字段）,对比 release 里的 latest-mac.yml。
#
# 发布已自动化:打 v<version> tag 触发 .github/workflows/desktop-release.yml,
#   CI 构建+签名+公证后,electron-builder --publish always 跨库发到公开库
#   publish.owner/repo（rambocode/cortex-work-release）。发版:bump 本 package.json version →
#   commit → 打同名 v<version> tag → push（tag 须与 version 一致）。
# ⚠️ macOS 自动更新要求应用正式签名(Developer ID);未签名时 electron-updater
#   会在下载/校验阶段报错,只能手动替换安装。
appId: ai.cortex.work
productName: Cortex
# node-pty 已由 pnpm 安装步按 onlyBuiltDependencies 重建;关掉 electron-builder 的原生重建,
# 让签名+发布步不在持有 PAT/证书时再跑 node-gyp 原生编译(密钥按步隔离,见计划 KTD8)。
npmRebuild: false
# ⚠️ beforePack 只能有一个入口。将来若需增加预打包步骤，必须并入此文件。
# 职责：①构建 whisper-cli（仅 darwin-arm64）；②删除非目标平台 whisper runner 目录。
beforePack: scripts/before-pack.cjs
directories:
  output: dist
# 应用内更新内容:由 scripts/extract-release-notes.mjs 在打包前生成 build/release-notes.md
# （从 CHANGELOG.md 提取当前版本段）。electron-builder 把它写进 latest-mac.yml 的 releaseNotes,
# 运行时 electron-updater 的 update-available/downloaded 事件 info.releaseNotes 即为该 markdown。
# releaseNotesFile 相对 buildResources（默认 build/）解析,故值为 release-notes.md。
releaseInfo:
  releaseNotesFile: release-notes.md
files:
  - out/**
  - assets/**
  - package.json
  # 防私有源码结构经 sourcemap 泄入公开产物（生产构建默认不出 .map,这里再加一道防御,见计划 F6）。
  - "!**/*.map"
  # ⚠️ @earendil-works 作用域整体**不得排除**。这里的判据在 pi 由二进制迁 in-process 后变了:
  #   旧判据(已作废):pi 聊天会话走 resources/pi 的 bun 自包含二进制、依赖全 inline,故
  #     pi-coding-agent / pi-agent-core / pi-tui 三包在 asar 里纯属冗余,曾被显式排除。
  #   新判据(现行):pi 的常驻 gateway worker（app.asar.unpacked/out/worker/pi-host.js）与主进程的
  #     单发 oneshot 都以裸包名动态 import pi-coding-agent 的 SDK（createAgentSession）,三包是
  #     **运行时依赖**——与 pi-ai 同构,都是 bundler 刻意不打包、只能靠 asar 里的 node_modules
  #     按包名解析（KTD1:动态 import + 变量 specifier + @vite-ignore;worker 从 unpacked 区发起的
  #     裸包名 import 已实测可解析到 asar 内的包）。
  # 排除其中任何一个 = 首次进入聊天时 ERR_MODULE_NOT_FOUND。作用域整体排除
  # (!@earendil-works/**)正是让 0.1.52/0.1.53 正式包连接测试全数报「模型运行时不可用」的原因,
  # 而这类事故**只在正式包暴露**（开发态从仓库 node_modules 解析,永远看不到）。
  # 已实测:三包在打包 app 的 asar 内按包名动态 import 成功,asar 因此约 +18MB。
  # 消费点:pi-ai 见 providers/pi-runtime.ts、providers/custom-provider-registry.ts;
  #        三包见 src/worker/pi-host/（gateway 执行体）与 agents/ 下的引擎层（oneshot）。
  # ——故此处不再列 pi-coding-agent / pi-agent-core / pi-tui 的排除项,保留本段说明防止被「顺手优化」回去。
  # agent-browser 通过 extraResources 仅携带目标平台二进制；npm 包含的其它平台二进制全部排除。
  - "!**/node_modules/agent-browser/**"
  # node-pty 自带 prebuilds/<platform-arch> 全架构预编译二进制,运行时按 platform/arch 自动选择;
  # 但本机 pnpm onlyBuiltDependencies 触发的 node-gyp 编译会在 build/Release 生成仅本机架构的
  # pty.node,其加载优先级高于 prebuilds(见 node-pty/lib/utils.js)。排除 build/ 强制统一走
  # prebuilds,避免打 x64/win 包时误带本机(arm64)编译产物、运行时加载错误架构崩溃。
  - "!**/node_modules/node-pty/build/**"
  # —— 以下 node_modules 仅 renderer 使用。renderer 未启用 externalizeDepsPlugin,electron-vite
  # 已把它们 bundle 进 out/，asar 里这份完整源码纯属冗余（monaco 一家就 93.5MB）。
  # main/preload 走 externalizeDepsPlugin,只 external 其实际 require 的
  # electron-updater/nodemailer/node-pty/croner/@electron-toolkit,故排除下列纯前端依赖
  # 不影响运行时解析。验证:打包后启动应用,控制台无 "Cannot find module"。
  - "!**/node_modules/monaco-editor/**"        # 93.5MB 代码编辑器
  - "!**/node_modules/@xterm/**"               # 5.6MB  终端 UI
  - "!**/node_modules/@codemirror/**"          # 2.8MB  编辑器组件
  # pdfjs-dist(写作 PDF 阅读 U5):renderer 阅读器 bundle 进 out/;主进程文本抽取用 legacy build,
  # 但它是 packages/views 的依赖、不在 apps/desktop 的 dependencies,externalizeDepsPlugin 不 external 它,
  # 故主进程那次 dynamic import 也 bundle 进 out/main。两端都不 require asar 这份,排除即纯省体积。
  # 发版前按本段抬头「打包后启动应用,控制台无 Cannot find module」核查一次(尤其 PDF 打开 + 检索索引路径)。
  - "!**/node_modules/pdfjs-dist/**"           # 12MB+  PDF 渲染/解析(renderer+main 均已 bundle）
  # ⚠️ highlight.js **不再排除**（曾以「纯 renderer 代码高亮 1.6MB,已 bundle 进 out/」为由排除）:
  # pi in-process 化后它同时是 @earendil-works/pi-coding-agent → pi-tui 的**运行时依赖**
  # （TUI 侧的语法高亮）。主进程并不用 TUI,但上游 exports 只有 `.` 与 `./rpc-entry`,import 图
  # 躲不开,asar 里必须留这份——否则首次 createAgentSession 即 ERR_MODULE_NOT_FOUND,且只在正式包暴露。
  # renderer 那份仍随 out/ bundle,二者并存(asar 这份是主进程必需,非冗余)。
  - "!**/node_modules/marked/**"               # markdown 渲染
  - "!**/node_modules/tailwind-merge/**"
  # ⚠️ LLM SDK 不再排除（曾以「core 引入,全部随 renderer bundle」为由排除过）:
  # 它们同时是 @earendil-works/pi-ai 的**运行时依赖**——主进程 pi-ai 的 api 实现按需
  # lazy-import 各家 SDK(openai / @anthropic-ai/sdk / @google/genai / @mistralai /
  # @aws-sdk+@smithy...),排除任何一个都会让对应供应商的连接测试/Model Gateway 在正式包里
  # 首次使用时 ERR_MODULE_NOT_FOUND。名单以 pi-ai 依赖闭包为准,升级 pi 后如需再做体积
  # 优化,必须先重新求一遍闭包再动排除项。
  # ⚠️ @silvia-odwyer（photon 图像处理,2.1MB）**不再排除**（曾以「pi 二进制自带、不在 pi-ai
  # 闭包内」为由排除）:该理由随 pi in-process 化失效——photon 是 @earendil-works/pi-coding-agent
  # 的**直接依赖**（图像处理/截图缩放),现由主进程从 asar 解析。它还是 wasm/native 侧的包,
  # 排除后的表现同样是首次用到时 ERR_MODULE_NOT_FOUND,只在正式包暴露。
  # ⚠️ 若后续再做体积优化:photon 与 jiti 在 asar 内的加载行为需实测,不能只按闭包纸面推断。
  # 注意:zod 不能排除!主进程的 @modelcontextprotocol/sdk(浏览器控制 MCP server)走
  # externalizeDepsPlugin、运行时从 asar node_modules require zod(且 require('zod/v3')),
  # 排除会导致打包后启动崩溃 "Cannot find module 'zod/v3'"。renderer 那份 zod 仍随 out/ bundle,
  # 二者并存(asar 这份 ~4MB 是主进程必需,非冗余)。
  # mermaid 图表渲染闭包（notes md 预览引入,纯 renderer,已 bundle 进 out/）。
  # mermaid 一家连同 cytoscape 图布局 / katex 公式 / d3 ≈ 107MB,是当前 asar 最大冗余。
  - "!**/node_modules/mermaid/**"              # 72.3MB
  - "!**/node_modules/@mermaid-js/**"          # 10.6MB 解析器
  - "!**/node_modules/cytoscape/**"            # 5.1MB
  - "!**/node_modules/cytoscape-*/**"          # 8.9MB fcose 等布局插件
  - "!**/node_modules/cose-base/**"
  - "!**/node_modules/layout-base/**"
  - "!**/node_modules/@dagrejs/**"
  - "!**/node_modules/dagre-d3-es/**"
  - "!**/node_modules/katex/**"                # 3.8MB 数学公式
  - "!**/node_modules/dompurify/**"            # 1.6MB SVG 消毒
  - "!**/node_modules/d3/**"                   # 1.0MB
  - "!**/node_modules/d3-*/**"                 # d3 微包闭包(scale/shape/...)
  - "!**/node_modules/langium/**"              # mermaid 新解析器依赖
  - "!**/node_modules/chevrotain/**"
  - "!**/node_modules/@chevrotain/**"
  - "!**/node_modules/khroma/**"
  - "!**/node_modules/stylis/**"
  # 其他纯 renderer 工具库:
  - "!**/node_modules/es-toolkit/**"           # 2.4MB
  - "!**/node_modules/lodash-es/**"            # 0.6MB
  - "!**/node_modules/@lezer/**"               # codemirror 语法定义
extraResources:
  # agent-browser 原生 CLI；prepackage 脚本只准备当前目标平台/架构，避免把 npm 包内全部平台
  # 二进制打进安装包。`${os}` 在 electron-builder 中展开为 mac/win。
  - from: resources/agent-browser/${os}-${arch}
    to: agent-browser
  # Cortex_Helper（快捷回复的 macOS 原生伴生二进制:AX/CGEventPost/Vision OCR/EventKit/事件 tap）,
  # 由 scripts/build-cortex-helper.mjs 用 swift build -c release 生成；落到
  # <App>/Contents/Resources/Cortex_Helper/Cortex_Helper,主进程 helper-client(U4)spawn 它。
  # 签名随 mac 段 hardenedRuntime/notarize 整体处理(与 pi 二进制同模式,无独立 binaries 列表)。
  - from: resources/Cortex_Helper
    to: Cortex_Helper
  # 内置 skills（compound-engineering vendoring，纯文本）,落到 <App>/Contents/Resources/skills/,
  # skills/locate.builtinSkillsRoot 打包态指向这里；第二阶段下载的官方库走 userData/skills 优先覆盖。
  - from: resources/skills
    to: skills
  # AI Slides 内置模板（35 套,纯文本 TEMPLATE.md + template.json + 参考页 HTML）。
  # 落到 <App>/Contents/Resources/slides/templates/,capabilities/slides/templates.ts 的
  # slidesTemplatesRoot() 打包态指向这里(开发态回落仓库内 resources/slides/templates)。
  # 放 extraResources 而非 asar:模板要按目录扫描 + 逐文件读,真实文件路径最省事且可被用户查看。
  - from: resources/slides
    to: slides
  # 本地 Whisper runner（U8）：whisper-cli 原生可执行文件不能进 asar（asar 是虚拟归档，
  # 原生二进制必须以真实文件存在才可被 child_process.spawn 执行）。
  # beforePack 中 prune 步骤已删除非目标平台目录，打包时只含目标平台产物。
  # 落到 <App>/Contents/Resources/whisper/<platform>-<arch>/，resolveWhisperRunner 打包态指向这里。
  - from: resources/whisper
    to: whisper
# pi 迁 in-process 后,三个 pi 包（coding-agent / agent-core / tui）以**纯 JS/ESM** 形式留在 asar 内,
# 已实测可从 asar 按包名动态 import,故**不需要** unpack。这里只列必须以真实文件落地的原生模块。
#（@mariozechner/clipboard 的 NAPI 由 electron-builder 自动 unpack,无需显式列出。）
# ⚠️ 待观察项:pi-coding-agent 闭包里的 jiti（运行时 TS 加载）与 photon-node（native/wasm）在 asar
# 内的行为要在护栏脚本里持续验证;若将来实测某个 .node 无法从 asar 加载,在此追加 unpack 而非改回排除。
asarUnpack:
  # Research Worker（CRE）：utilityProcess.fork 的入口是纯 JS，理论上从 asar 内加载没问题，
  # 但子进程的模块解析根与 asar 边界的交互历史上不稳（见 doc-extract 的教训），且解包纯 JS
  # 零成本。打包后须实测 fork 成功（P9 的 verify-research-packaging.mjs）。
  - "out/worker/**"
  - "**/node_modules/node-pty/**"
  # node-mac-permissions（reply 权限查询,U4):node-gyp 从源码编译的原生模块,无 prebuilds。
  # 原生 .node 必须以真实文件解包才可被主进程 dynamic import 加载(asar 内加载不可靠);
  # 且它是 mac 专属可选依赖——加载失败时 permissions.ts 会回退 helper permissions 命令(不崩)。
  - "**/node_modules/node-mac-permissions/**"
  # 文档抽取(doc-extract):@firecrawl/anydoc 是 napi-rs 原生模块(主包 index.js + 平台子包内
  # 的 .node 二进制)。原生 .node 必须以真实文件解包才可被主进程加载(asar 内加载不可靠),
  # 故把 @firecrawl 作用域(主包 + anydoc-darwin-* 等平台子包)整体 unpack。
  # ⚠ 仓库外 ditto→/tmp 验证:若有 "Cannot find module"/.node 加载失败,按 docs/lessons.md 排查。
  - "**/node_modules/@firecrawl/**"
mac:
  category: public.app-category.productivity
  icon: assets/cortex-neuron-icon.png
  hardenedRuntime: true
  # 覆盖 electron-builder 默认 entitlements 模板(只含 JIT/内存/库校验三条,缺麦克风/日历)。
  # hardened runtime 下访问这些资源必须有对应 entitlement,否则系统直接拒绝、不会弹 TCC/入权限列表。
  # entitlementsInherit 同一份文件,覆盖 extraResources 里的 Cortex_Helper(EventKit 读日历)
  # 及 Electron 自身 Renderer/GPU 子进程签名——只设 entitlements 会漏掉这些嵌套可执行文件。
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  identity: "Jiangwei Lan (HQ537XMLJY)"
  notarize: true
  # NSMicrophoneUsageDescription：macOS 要求应用在 Info.plist 声明麦克风用途描述，
  # 否则系统在首次访问麦克风时会拒绝授权并弹出无描述的空白权限弹窗。
  # 本字段覆盖 Electron 默认（通常为空或泛型描述），提供产品级用户文案。
  extendInfo:
    NSMicrophoneUsageDescription: "Cortex 需要访问麦克风以使用语音转文字功能，将您的语音实时转为文字输入。"
    NSSpeechRecognitionUsageDescription: "Cortex 需要访问语音识别权限，以便在快捷回复中将语音输入转换为文字。"
    # 日历用途描述：产品现在既读也写，两条文案必须如实覆盖两种用途。
    # 只写「读取忙碌时间」而实际会创建日程，是审核与用户信任问题；反过来，用户看到一个
    # 「只读忙碌时间」的请求却被要求完全访问，也更可能直接拒绝。
    NSCalendarsUsageDescription: "Cortex 需要访问日历，以便在快捷回复中生成合适的日程建议、在对话中回答你的日程安排，并在你确认后为你创建日程。"
    NSCalendarsFullAccessUsageDescription: "Cortex 需要完全访问日历，以便读取你的日程来回答安排类问题，并在你逐次确认后创建日程。"
    # NSAccessibilityUsageDescription：辅助功能授权（快捷回复的输入框定位/粘贴，以及
    # Computer Use 的鼠标键盘操作都依赖它）。此前留空，系统授权弹窗与「隐私与安全性」
    # 列表里就只有一个没有理由说明的条目，用户无从判断该不该给——尤其 Computer Use 要的是
    # 「控制这台电脑」这种高权限，不写清用途几乎必然被拒。
    NSAccessibilityUsageDescription: "Cortex 需要辅助功能权限，以便定位当前应用的输入框（快捷回复）以及在您确认后代您操作鼠标键盘（电脑操作）。"
  # 显式覆盖命名模板,强制所有架构文件名都带 ${arch}。electron-builder 默认把 x64 当"默认架构"、
  # 文件名不带 arch 后缀(如 Cortex-x.dmg),与 arm64 的 Cortex-x-arm64.dmg 长得不对称、极易看混——
  # 这正是此前 v0.1.27 发布事故里 x64 产物被误当 arm64 上传覆盖的根源之一。
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    # 自动更新走 zip,人工分发用 dmg。arch 数组仅声明"允许构建的架构";每次实际构建只应产出
    # 单一架构,两架构仍串行构建、发布只在最后合并双架构清单后做一次(分次上传会互相覆盖,
    # 即 v0.1.27 事故根源,与 pi 无关、任何时候不得放开)。原先「resources/pi 单一共享目录」
    # 的串行理由已随 pi gateway 化删除而消失,但 release:ui/local-release-mac.sh 的阶段编排与
    # 断点续跑状态机按串行设计,是否可并行需单独评估。同一条约束在根 CLAUDE.md「发版规范」
    # 还有一份副本,改一处必须改两处。
    # ⚠️ 单架构靠 CLI 精确控制,踩过坑:必须显式带上目标类型名(如 `--mac zip dmg --arm64`),
    #   光传 `--mac --arm64` 不够——electron-builder 的 CLI 只有在显式列出 zip/dmg 等类型名时才会
    #   忽略本文件里这份 arch 数组、只按 --arm64/--x64 构建单一架构;不带类型名时会退回到按
    #   这里声明的 arch 数组全量展开,--arm64/--x64 形同虚设,一次命令会把 arm64+x64 都编译进去
    #   (见 apps/desktop/package.json 的 build:mac-arm64/build:mac-x64 脚本写法)。
    - target: zip
      arch: [arm64, x64]
    - target: dmg
      arch: [arm64, x64]
win:
  icon: assets/cortex-neuron-icon.png
  # 显式使用无空格文件名。GitHub 上传含空格资产时会把空格改成点号，而 latest.yml 使用连字符，
  # 两者不一致会令 NsisUpdater 下载 404。
  artifactName: ${productName}-Setup-${version}.${ext}
  # 只出 nsis:Windows 自动更新(NsisUpdater)与人工分发都用 .exe,zip 纯冗余,已移除不再生成/发布。
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  deleteAppDataOnUninstall: false
publish:
  provider: github
  owner: rambocode
  repo: cortex-work-release
  # 直接出正式 release（electron-builder 默认建 draft）。Release 仓库只承载产物与更新清单。
  releaseType: release
