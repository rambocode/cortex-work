# Cortex Desktop 打包 / 发布配置（electron-builder）。
# 自动更新走 GitHub Releases:electron-updater 读取打包时生成的
# app-update.yml（来自下方 publish 字段）,对比 release 里的 latest-mac.yml。
#
# ⚠️ 发布前必改:把 publish.owner 换成你的 GitHub 用户名/组织,并确保
#   该 repo 存在。发版流程:更新 package.json version → pnpm dist →
#   把 dist/ 里的 dmg、zip、latest-mac.yml 一起传到 GitHub Release（tag v<version>）。
# ⚠️ macOS 自动更新要求应用正式签名(Developer ID);未签名时 electron-updater
#   会在下载/校验阶段报错,只能手动替换安装。
appId: ai.cortex.work
productName: Cortex Desktop
directories:
  output: dist
files:
  - out/**
  - assets/**
  - package.json
  # pi 改用 resources/pi 下的 bun 自包含二进制（extraResources）,npm 包不必进 asar,排除省体积。
  - "!**/node_modules/@earendil-works/**"
extraResources:
  # pi 的 bun 二进制 + 旁置资产（theme/assets/export-html/wasm）,由 scripts/build-pi-binary.mjs
  # 生成；落到 <App>/Contents/Resources/pi/,pi-locate.resolvePiBinary 打包态指向这里。
  - from: resources/pi
    to: pi
# pi 现在走 resources/pi 下的 bun 自包含二进制（extraResources,不进 asar）,依赖全 inline,
# 故无需再为 pi 依赖 unpack 任何 node_modules。这里只留必须落地的原生模块:node-pty。
#（@mariozechner/clipboard 的 NAPI 由 electron-builder 自动 unpack,无需显式列出。）
asarUnpack:
  - "**/node_modules/node-pty/**"
mac:
  category: public.app-category.productivity
  icon: assets/cortex-neuron-icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  identity: "Jiangwei Lan (HQ537XMLJY)"
  notarize: true
  target:
    # 自动更新走 zip,人工分发用 dmg
    - target: zip
      arch: [arm64]
    - target: dmg
      arch: [arm64]
publish:
  provider: github
  owner: OWNER_PLACEHOLDER # TODO: 改成真实 GitHub 用户名/组织;改后把 src/main/ipc/update.ts 的 UPDATE_FEED_CONFIGURED 置 true
  repo: cortex-work
