<!doctype html>
<!-- POC fixture 3:简单表格 — 应重建为原生 PPTX table(单元格可编辑)。 -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #ffffff; font-family: Helvetica, "PingFang SC", sans-serif; position: relative; }
  table { border-collapse: collapse; }
  th, td { border: 1px solid #cbd5e1; padding: 12px 16px; font-size: 20px; text-align: left; }
  th { background: #f1f5f9; color: #0f172a; font-weight: 700; }
  td { color: #334155; }
  td.num { text-align: right; }
</style>
</head>
<body>
  <h2 data-cortex-id="table-title" style="position:absolute; left:140px; top:70px; width:600px; height:44px; font-size:32px; font-weight:700; color:#111827; line-height:44px;">季度指标对比</h2>
  <table data-cortex-id="metrics-table" style="position:absolute; left:140px; top:160px; width:1000px;">
    <thead>
      <tr><th>指标</th><th>第一季度</th><th>第二季度</th></tr>
    </thead>
    <tbody>
      <tr><td>活跃用户</td><td class="num">12,480</td><td class="num">18,930</td></tr>
      <tr><td>转化率</td><td class="num">3.2%</td><td class="num">4.7%</td></tr>
    </tbody>
  </table>
</body>
</html>
