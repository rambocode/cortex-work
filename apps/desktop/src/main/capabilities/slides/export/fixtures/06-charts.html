<!doctype html>
<!-- fixture 6:原生图表(bar/line/pie) + 一个非法合同 fallback。
     预期:合法 data-cortex-chart-spec 生成原生 chart 节点,同容器 canvas 不再产出 raster;
     非法合同保持 canvas raster fallback,且不重复产出。 -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #ffffff; font-family: Helvetica, "PingFang SC", sans-serif; position: relative; }
  .chart-wrap {
    position: absolute;
    width: 260px;
    height: 180px;
    overflow: hidden;
  }
  canvas { display: block; width: 260px; height: 180px; }
</style>
</head>
<body>
  <div class="chart-wrap" data-cortex-id="chart-bar" aria-label="季度收入柱状图" style="left:60px; top:80px;">
    <script type="application/json" data-cortex-chart-spec>
      {"version":1,"type":"bar","categories":["Q1","Q2","Q3"],"series":[{"name":"收入","values":[12,18,24],"color":"#3366FF"},{"name":"成本","values":[6,9,12],"color":"#FF8A00"}],"legend":true,"dataLabels":true,"xAxisTitle":"季度","yAxisTitle":"万元"}
    </script>
    <canvas width="260" height="180"></canvas>
  </div>

  <div class="chart-wrap" data-cortex-id="chart-line" aria-label="激活率折线图" style="left:360px; top:80px; color:#1f2937; font-size:14px;">
    <script type="application/json" data-cortex-chart-spec>
      {"version":1,"type":"line","categories":["周一","周二","周三"],"series":[{"name":"激活率","values":[42,51,63],"color":"#10B981"}],"legend":false,"dataLabels":false,"xAxisTitle":"日期","yAxisTitle":"%"}
    </script>
    <canvas width="260" height="180"></canvas>
  </div>

  <div class="chart-wrap" data-cortex-id="chart-pie" aria-label="渠道占比饼图" style="left:660px; top:80px; color:#334155; font-size:13px;">
    <script type="application/json" data-cortex-chart-spec>
      {"version":1,"type":"pie","categories":["自然流量","投放","转介绍"],"series":[{"name":"占比","values":[56,28,16],"color":"#7C3AED"}],"legend":true,"dataLabels":true,"xAxisTitle":"无效横轴","yAxisTitle":"无效纵轴"}
    </script>
    <canvas width="260" height="180"></canvas>
  </div>

  <div class="chart-wrap" data-cortex-id="chart-invalid" aria-label="非法合同图表" style="left:960px; top:80px;">
    <script type="application/json" data-cortex-chart-spec>
      {"version":1,"type":"bar","categories":["Q1","Q2"],"series":[{"name":"收入","values":[12]}],"legend":true}
    </script>
    <canvas width="260" height="180"></canvas>
  </div>

  <script>
    function paintBars(canvas) {
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      [90, 120, 145].forEach((h, i) => {
        ctx.fillStyle = ["#3366FF", "#6D8FFF", "#9DB4FF"][i];
        ctx.fillRect(24 + i * 72, 160 - h, 38, h);
      });
    }
    function paintLine(canvas) {
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#f8fafc";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = "#10B981";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(28, 132);
      ctx.lineTo(118, 100);
      ctx.lineTo(214, 64);
      ctx.stroke();
    }
    function paintPie(canvas) {
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      const slices = [
        { end: Math.PI * 1.12, color: "#7C3AED" },
        { end: Math.PI * 1.68, color: "#38BDF8" },
        { end: Math.PI * 2, color: "#F59E0B" },
      ];
      let start = -Math.PI / 2;
      slices.forEach((slice) => {
        ctx.beginPath();
        ctx.moveTo(130, 90);
        ctx.fillStyle = slice.color;
        ctx.arc(130, 90, 64, start, slice.end);
        ctx.closePath();
        ctx.fill();
        start = slice.end;
      });
    }
    function paintInvalid(canvas) {
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#fef2f2";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ef4444";
      ctx.fillRect(30, 70, 40, 80);
      ctx.fillRect(98, 100, 40, 50);
    }
    const canvases = document.querySelectorAll("canvas");
    paintBars(canvases[0]);
    paintLine(canvases[1]);
    paintPie(canvases[2]);
    paintInvalid(canvases[3]);
  </script>
</body>
</html>
