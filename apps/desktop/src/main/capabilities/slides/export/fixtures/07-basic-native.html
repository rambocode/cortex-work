<!doctype html>
<!-- fixture 7:基础原生映射(svg/image/text/rotate/table merge)。
     预期:
       - inline svg → 原生 image(data:image/svg+xml)
       - img object-fit contain/cover + object-position → 记录到 scene,Node 侧映射 sizing
       - bullet/numbering/paragraph spacing/valign 保留
       - rotate/opacity 保留; scale/blend 继续 raster
       - table rowspan/colspan 保留 merge; border-radius 给 warning -->
<html lang="zh-Hans">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 720px; overflow: hidden; }
  body { background: #ffffff; font-family: Helvetica, "PingFang SC", sans-serif; position: relative; }
  .frame { position:absolute; overflow:hidden; border: 1px solid #cbd5e1; background:#f8fafc; }
  .table { position:absolute; left:860px; top:340px; width:320px; border-collapse: collapse; border-radius: 14px; overflow:hidden; }
  .table th, .table td { border:1px solid #cbd5e1; padding: 8px 12px; font-size: 15px; color:#0f172a; }
  .table th { background:#f1f5f9; font-weight:700; }
</style>
</head>
<body>
  <svg data-cortex-id="inline-svg" aria-label="SVG 徽章" viewBox="0 0 140 90" width="140" height="90"
       style="position:absolute; left:60px; top:60px; width:140px; height:90px;">
    <rect x="5" y="5" width="130" height="80" rx="18" fill="#E0F2FE" stroke="#0284C7" stroke-width="4"></rect>
    <circle cx="38" cy="45" r="14" fill="#0EA5E9"></circle>
    <text x="64" y="52" font-size="20" font-family="Helvetica" fill="#0F172A">SVG</text>
  </svg>

  <div class="frame" data-cortex-id="img-contain-frame" style="left:240px; top:50px; width:180px; height:120px;">
    <img data-cortex-id="img-contain" alt="contain image" width="400" height="200"
      src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='200'%3E%3Crect width='200' height='200' fill='%23f97316'/%3E%3Crect x='200' width='200' height='200' fill='%230ea5e9'/%3E%3C/svg%3E"
      style="width:100%; height:100%; object-fit:contain; object-position:left bottom;" />
  </div>

  <div class="frame" data-cortex-id="img-cover-frame" style="left:470px; top:50px; width:180px; height:120px;">
    <img data-cortex-id="img-cover" alt="cover image" width="400" height="200"
      src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='400' height='200'%3E%3Crect width='100' height='200' fill='%230f172a'/%3E%3Crect x='100' width='300' height='200' fill='%23a855f7'/%3E%3C/svg%3E"
      style="width:100%; height:100%; object-fit:cover; object-position:75% 25%;" />
  </div>

  <div data-cortex-id="rotated-card"
       style="position:absolute; left:60px; top:220px; width:180px; height:90px; background:#2563eb; opacity:0.6; transform:rotate(15deg); border-radius:16px;"></div>

  <div data-cortex-id="unsupported-scale"
       style="position:absolute; left:280px; top:230px; width:120px; height:80px; background:#f59e0b; transform:scale(1.2);"></div>

  <div data-cortex-id="unsupported-blend"
       style="position:absolute; left:430px; top:230px; width:120px; height:80px; background:#ef4444; mix-blend-mode:multiply;"></div>

  <div data-cortex-id="center-callout"
       style="position:absolute; left:60px; top:340px; width:220px; height:90px; display:flex; align-items:center; justify-content:center; color:#0f172a; font-size:20px; opacity:0.8; transform:rotate(5deg);">
    居中提示
  </div>

  <ul data-cortex-id="bullet-list" style="position:absolute; left:320px; top:330px; width:220px; padding-left:24px;">
    <li style="font-size:16px; color:#0f172a; margin-bottom:12px;">第一条项目符号</li>
    <li style="font-size:16px; color:#0f172a;">第二条项目符号</li>
  </ul>

  <ol data-cortex-id="number-list" start="3" style="position:absolute; left:580px; top:330px; width:220px; padding-left:24px;">
    <li style="font-size:16px; color:#0f172a; margin-bottom:10px;">第三步</li>
    <li style="font-size:16px; color:#0f172a;">第四步</li>
  </ol>

  <section data-cortex-id="mixed-inline-block"
           style="position:absolute; left:60px; top:470px; width:300px; padding:14px 18px; background:#fff7ed; color:#9a3412; font-size:18px; line-height:1.5;">
    混排前缀
    <div style="font-size:16px; font-weight:700; color:#7c2d12; margin-top:10px;">块级重点</div>
    混排后缀
  </section>

  <table class="table" data-cortex-id="merge-table">
    <tr>
      <th colspan="2">汇总</th>
      <th rowspan="2">状态</th>
    </tr>
    <tr>
      <td>收入</td>
      <td>¥120k</td>
    </tr>
    <tr>
      <td rowspan="2">地区</td>
      <td>华东</td>
      <td>稳定</td>
    </tr>
    <tr>
      <td>华南</td>
      <td>增长</td>
    </tr>
  </table>
</body>
</html>
