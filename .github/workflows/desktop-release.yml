name: Desktop Release
run-name: Desktop Release ${{ github.ref_name }}

# 私有库(闭源)的 macOS 构建/发布流水线。按 mode 分档,门槛递增:
#  - build-unsigned(默认 dispatch):只构建未签名包(bun/pnpm/electron-vite/electron-builder 打包),
#    **不需要任何 secret**。用于先验证闭源库的自动构建链能否在 CI 跑通。
#  - build-signed:构建 + Developer ID 签名 + Apple 公证 + 仓库外校验,不发布。需 5 个签名 secret。
#  - publish-self(dispatch):构建 + 签名 + 公证 + 发到**本仓库** rambocode/cortex-work 的 Release。
#    用默认 GITHUB_TOKEN(同仓库写,需 permissions: contents: write),无需 PAT;只需 5 个签名 secret。
#    本仓库为私有库,Release 仅维护者可下载——自取后转发分发(如官网/网盘)。
#  - publish-draft / publish-release(dispatch):electron-builder --publish always 跨库发到
#    公开库 rambocode/cortex-desktop(见 apps/desktop/electron-builder.yml 的 publish),需 RELEASE_GH_TOKEN(PAT)。
#  - tag push:自动构建签名产物并上传 artifact;不跨库发布,避免没有 RELEASE_GH_TOKEN 时阻断构建。
#    依赖 U1(建公开库 + PAT + Environment),完成后再用。
# 设计见 docs/plans/2026-06-16-002-feat-desktop-release-automation-plan.md。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build-unsigned=只验证构建(无需 secret);build-signed=+签名公证(需签名 secret);publish-self=签名公证+发到本仓库 Release(需签名 secret,用默认 token);publish-*=跨库发布(需 U1 的 PAT)"
        type: choice
        options:
          - build-unsigned
          - build-signed
          - publish-self
          - publish-draft
          - publish-release
        default: build-unsigned
  push:
    tags:
      - "v*"

# publish-self 用默认 GITHUB_TOKEN 写本仓库 Release,故需 contents: write。
# 跨库写公开库仍完全靠 RELEASE_GH_TOKEN(PAT),与此默认 token 无关(默认 token 无跨库权限)。
permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: Build (sign/publish per mode) — macOS arm64
    # 必须 GitHub-hosted(一次性 VM);禁 self-hosted,否则证书/keychain 跨 job 残留。
    runs-on: macos-15
    timeout-minutes: 60
    # 签名/公证 secret 与 PAT 放在受保护 Environment(配 tag 进入策略;多维护者时再加 required reviewers)。
    environment: production-release
    env:
      # tag push 一律走签名构建;dispatch 取所选 mode,默认 build-unsigned。MODE 是受限取值,非密钥。
      # 跨库 publish-release 仅在 workflow_dispatch 显式选择时使用,避免缺 RELEASE_GH_TOKEN 阻断 tag 构建。
      MODE: ${{ (github.event_name == 'push' && 'build-signed') || github.event.inputs.mode || 'build-unsigned' }}
      BUILD_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 先启用 pnpm,后面 setup-node 的 cache: pnpm 才能解析(pnpm 须先在 PATH)。
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      # build:pi 用 bun --compile 产出 pi 自包含二进制(resources/pi 被 gitignore,CI 须现场生成)。
      # 固定 bun 版本,避免 pi 二进制因 bun 漂移而不可复现。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # 在拉取/执行第三方代码之前先校验 secret(本步只读非空、不外泄)。
      # build-unsigned 无需任何 secret;build-signed 需 5 个签名 secret;publish-* 另需 PAT。
      - name: Verify secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          case "$MODE" in
            build-unsigned)            required="" ;;
            # publish-self 发本仓库用默认 GITHUB_TOKEN,只需 5 个签名 secret,不需要 PAT。
            build-signed|publish-self) required="APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD" ;;
            *)                         required="APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD RELEASE_GH_TOKEN" ;;
          esac
          if [[ -z "$required" ]]; then
            echo "mode=$MODE:无需 secret"
            exit 0
          fi
          missing=()
          for name in $required; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secrets for mode=$MODE: ${missing[*]}" >&2
            exit 1
          fi
          echo "Secrets OK for mode=$MODE"

      # tag 与 apps/desktop/package.json version 必须一致,否则 latest-mac.yml 版本错位、自动更新失效。
      # 仅 tag push 校验;dispatch(无 tag)跳过。
      - name: Assert tag matches package.json version
        if: github.event_name == 'push'
        run: |
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "Tag ($tag_version) does not match apps/desktop/package.json version ($pkg_version)" >&2
            exit 1
          fi
          echo "Version match: $pkg_version"

      # —— 无密钥步:安装依赖 + 预构建(build:pi 的 bun 编译 + electron-vite),不注入任何 secret。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepackage (build pi binary + renderer/main)
        run: pnpm --filter @cortex-work/desktop run prepackage:mac

      # —— 打包步:按 mode 决定是否签名/发布。electron-builder 从已构建的 out/ 打包,
      # npmRebuild: false 使其不在本步跑 node-gyp 原生编译。签名/PAT 凭据仅此步注入。
      - name: Build (and sign/publish per mode)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: "Jiangwei Lan (HQ537XMLJY)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 两类发布 token 都注入,运行时按 mode 选用:publish-self 用默认 GITHUB_TOKEN(本仓库);
          # publish-draft/release 用 PAT(跨库公开库)。GH_TOKEN 是 electron-builder 读取的固定变量名,
          # 故不在此处静态赋值,改在脚本内按 mode export,避免把错的 token 喂给跨库发布。
          SELF_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          case "$MODE" in
            build-unsigned)
              echo "build-unsigned:构建未签名包(验证构建链,无需 secret)"
              pnpm --filter @cortex-work/desktop run build:mac -- -c.mac.identity=null -c.mac.notarize=false
              ;;
            build-signed)
              echo "build-signed:构建 + 签名 + 公证(不发布)"
              pnpm --filter @cortex-work/desktop run build:mac
              ;;
            publish-self)
              echo "publish-self:构建 + 签名 + 公证,发到本仓库 rambocode/cortex-work 的 Release(默认 token)"
              export GH_TOKEN="$SELF_GH_TOKEN"
              # 覆盖 electron-builder.yml 的跨库 publish 目标,改发本仓库(同仓库,默认 token 即可写)。
              pnpm --filter @cortex-work/desktop run release:mac -- \
                -c.publish.provider=github \
                -c.publish.owner=rambocode \
                -c.publish.repo=cortex-work \
                -c.publish.releaseType=release
              ;;
            *)
              export GH_TOKEN="$RELEASE_GH_TOKEN"
              rt="release"
              if [[ "$MODE" == "publish-draft" ]]; then
                rt="draft"
              fi
              echo "publish(mode=$MODE):releaseType=$rt,跨库发到公开库"
              pnpm --filter @cortex-work/desktop run release:mac -- -c.publish.releaseType="$rt"
              ;;
          esac

      # 仅签名档校验签名/公证(未签名包跑 codesign 必失败);在仓库外副本上做,规避仓库 node_modules 假通过。
      - name: Verify signed app and dmg (outside repo)
        if: ${{ env.MODE != 'build-unsigned' }}
        run: |
          src="apps/desktop/dist"
          work="$(mktemp -d)"
          product_name="$(node -p "require('./apps/desktop/package.json').productName")"
          app="$src/mac-arm64/${product_name}.app"
          app_copy="$work/${product_name}.app"
          ditto "$app" "$app_copy"
          codesign --verify --deep --strict --verbose=2 "$app_copy"
          codesign -dv --verbose=4 "$app_copy"
          spctl --assess --type execute --verbose "$app_copy"
          xcrun stapler validate "$app_copy"
          dmg="$(ls -1 "$src"/*-arm64.dmg | head -n 1)"
          cp "$dmg" "$work/"
          dmg_copy="$work/$(basename "$dmg")"
          # dmg 为人工分发容器:app 已签名+公证+staple(上面是硬门)。dmg 本身是否独立签名/公证取决于
          # electron-builder(它公证的是 app),故下面两条仅信息性报告,不因 dmg 无独立签名/票据而 fail 构建。
          spctl --assess --type open --context context:primary-signature --verbose "$dmg_copy" \
            || echo "DMG 无独立代码签名/公证 — 可接受(挂载后 app 已公证,Gatekeeper 认 app)。"
          xcrun stapler validate "$dmg_copy" \
            || echo "DMG 无 stapled ticket — 可接受(app ticket 已 staple)。"

      # 构建产物 artifact:build 档取回产物的通道(也确认产物确实生成);publish 档作冗余备份。
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cortex-desktop-${{ env.BUILD_TAG }}-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*-arm64.dmg
            apps/desktop/dist/*-arm64.dmg.blockmap
            apps/desktop/dist/*-arm64-mac.zip
            apps/desktop/dist/*-arm64-mac.zip.blockmap
            apps/desktop/dist/latest-mac.yml
