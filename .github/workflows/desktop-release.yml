name: Desktop Release
run-name: Desktop Release ${{ github.ref_name }}

# 私有库(闭源)的多架构构建/发布流水线。三个构建 job(macOS arm64 / macOS x64 / Windows x64)
# 各自独立产出;正式发布时先创建 draft Release,三端将产物直接传入草稿,publish job 再合并
# macOS 双架构 latest-mac.yml,校验通过后统一公开。非发布模式仍用 workflow artifact。按 mode 分档,门槛递增:
#  - build-unsigned(默认 dispatch):只构建未签名包(bun/pnpm/electron-vite/electron-builder 打包),
#    **不需要任何 secret**。用于先验证闭源库的自动构建链能否在 CI 跑通。
#  - build-signed:构建 + Developer ID 签名 + Apple 公证 + 仓库外校验,不发布。需 5 个签名 secret。
#  - publish-self(dispatch):构建 + 签名 + 公证 + 发到**本仓库** rambocode/cortex-work 的 Release。
#    用默认 GITHUB_TOKEN(同仓库写,需 permissions: contents: write),无需 PAT;只需 5 个签名 secret。
#    本仓库为私有库,Release 仅维护者可下载——自取后转发分发(如官网/网盘)。
#  - publish-draft / publish-release(dispatch):跨库发到公开库 rambocode/cortex-work-release
#    (见 apps/desktop/electron-builder.yml 的 publish),需 RELEASE_GH_TOKEN(PAT)。
#  - tag push:自动构建、签名、公证,并发布到 rambocode/cortex-work-release。
# Windows 不签名(CSC_IDENTITY_AUTO_DISCOVERY=false 现状不变),故 build-windows-x64 job
# 不需要任何 Apple/签名 secret,始终按同一套流程构建,只是否发布仍受 MODE 控制。
#
# ⚠️ v0.1.27 发布事故复盘:此前只有 arm64 一条流水线,latest-mac.yml 被人手动跑 x64 构建后
#   误覆盖成只含 x64 条目,electron-updater 的 MacUpdater 在清单只有一种架构时不做机器架构过滤,
#   导致 arm64 用户升级后被误装 x64(Rosetta)版本。本次改造新增的双重护栏(merge 脚本内置断言 +
#   publish job 独立 --verify 复核)专门针对这个失败模式,任一护栏不过直接中止发布。
# 设计见 docs/plans/2026-06-16-002-feat-desktop-release-automation-plan.md。

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "build-unsigned=只验证构建(无需 secret);build-signed=+签名公证(需签名 secret);publish-self=签名公证+发到本仓库 Release(需签名 secret,用默认 token);publish-*=跨库发布(需 U1 的 PAT)"
        type: choice
        options:
          - build-unsigned
          - build-signed
          - publish-self
          - publish-draft
          - publish-release
        default: build-unsigned
  push:
    tags:
      - "v*"

# publish-self 用默认 GITHUB_TOKEN 写本仓库 Release,故需 contents: write。
# 跨库写公开库仍完全靠 RELEASE_GH_TOKEN(PAT),与此默认 token 无关(默认 token 无跨库权限)。
permissions:
  contents: write

jobs:
  # 正式发布先创建不可见的 draft Release。三个构建 job 直接把产物上传到该草稿，避免依赖
  # Actions artifact 存储配额；全部构建和清单护栏通过后，publish job 才将草稿公开。
  prepare-release:
    name: Prepare draft release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-release
    env:
      MODE: ${{ (github.event_name == 'push' && 'publish-release') || github.event.inputs.mode || 'build-unsigned' }}
      BUILD_TAG: ${{ github.ref_name }}
    outputs:
      target_repo: ${{ steps.target.outputs.repo }}

    steps:
      - name: Create draft release for direct asset transfer
        id: target
        if: ${{ contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), env.MODE) }}
        env:
          SELF_GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          repo="rambocode/cortex-work-release"
          token="$RELEASE_GH_TOKEN"
          if [[ "$MODE" == "publish-self" ]]; then
            repo="rambocode/cortex-work"
            token="$SELF_GH_TOKEN"
          fi
          export GH_TOKEN="$token"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

          if [[ "$repo" == "rambocode/cortex-work-release" ]]; then
            default_branch="$(gh repo view "$repo" --json defaultBranchRef --jq '.defaultBranchRef.name')"
            target_sha="$(gh api "repos/$repo/commits/$default_branch" --jq '.sha')"
            if ! gh api "repos/$repo/git/ref/tags/$BUILD_TAG" >/dev/null 2>&1; then
              gh api --method POST "repos/$repo/git/refs" \
                -f ref="refs/tags/$BUILD_TAG" \
                -f sha="$target_sha" >/dev/null
            fi
          fi

          if ! gh release view "$BUILD_TAG" --repo "$repo" >/dev/null 2>&1; then
            gh release create "$BUILD_TAG" \
              --repo "$repo" \
              --title "${BUILD_TAG#v}" \
              --notes "构建与发布校验进行中。" \
              --draft
          fi

  build-macos-arm64:
    name: Build (sign/publish per mode) — macOS arm64
    needs: prepare-release
    # 必须 GitHub-hosted(一次性 VM);禁 self-hosted,否则证书/keychain 跨 job 残留。
    runs-on: macos-15
    timeout-minutes: 60
    # 签名/公证 secret 与 PAT 放在受保护 Environment(配 tag 进入策略;多维护者时再加 required reviewers)。
    environment: production-release
    env:
      # tag push 一律走正式发布;dispatch 取所选 mode,默认 build-unsigned。MODE 是受限取值,非密钥。
      MODE: ${{ (github.event_name == 'push' && 'publish-release') || github.event.inputs.mode || 'build-unsigned' }}
      BUILD_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # 先启用 pnpm,后面 setup-node 的 cache: pnpm 才能解析(pnpm 须先在 PATH)。
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      # build:pi 用 bun --compile 产出 pi 自包含二进制(resources/pi 被 gitignore,CI 须现场生成)。
      # 固定 bun 版本,避免 pi 二进制因 bun 漂移而不可复现。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # 在拉取/执行第三方代码之前先校验 secret(本步只读非空、不外泄)。
      # build-unsigned 无需任何 secret;build-signed 需 5 个签名 secret;publish-* 另需 PAT。
      - name: Verify secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          case "$MODE" in
            build-unsigned)            required="" ;;
            # publish-self 发本仓库用默认 GITHUB_TOKEN,只需 5 个签名 secret,不需要 PAT。
            build-signed|publish-self) required="APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD" ;;
            *)                         required="APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD RELEASE_GH_TOKEN" ;;
          esac
          if [[ -z "$required" ]]; then
            echo "mode=$MODE:无需 secret"
            exit 0
          fi
          missing=()
          for name in $required; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secrets for mode=$MODE: ${missing[*]}" >&2
            exit 1
          fi
          echo "Secrets OK for mode=$MODE"

      # tag 与 apps/desktop/package.json version 必须一致,否则 latest-mac.yml 版本错位、自动更新失效。
      # 仅 tag push 校验;dispatch(无 tag)跳过。
      - name: Assert tag matches package.json version
        if: github.event_name == 'push'
        run: |
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "Tag ($tag_version) does not match apps/desktop/package.json version ($pkg_version)" >&2
            exit 1
          fi
          echo "Version match: $pkg_version"

      # —— 无密钥步:安装依赖 + 预构建(build:pi 的 bun 编译 + electron-vite),不注入任何 secret。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # prepackage 链含 prebuild:notes:从 CHANGELOG 提取当前版本段 → build/release-notes.md,
      # 供后续 electron-builder（写入 latest-mac.yml）与 publish job 的 gh release（--notes-file）共用。
      # 仅 publish-release 严格:CHANGELOG 无当前版本段时让脚本非零退出、中止发布,避免静默丢 notes。
      - name: Prepackage (build pi binary + renderer/main, arch=arm64)
        env:
          CORTEX_NOTES_STRICT: ${{ env.MODE == 'publish-release' && '1' || '' }}
        run: pnpm --filter @cortex-work/desktop run prepackage:mac-arm64

      # —— 打包步:按 mode 决定是否签名。electron-builder 从已构建的 out/ 打包,
      # npmRebuild: false 使其不在本步跑 node-gyp 原生编译。签名凭据仅此步注入。
      # 本 job 只将资产传入不可见的 draft Release；最终清单合并与公开仍统一由 publish job 完成。
      - name: Build (and sign per mode)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: "Jiangwei Lan (HQ537XMLJY)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$MODE" == "build-unsigned" ]]; then
            echo "build-unsigned:构建未签名包(验证构建链,无需 secret)"
            pnpm --filter @cortex-work/desktop run build:mac-arm64 -- -c.mac.identity=null -c.mac.notarize=false
          else
            echo "mode=$MODE:构建 + 签名 + 公证"
            pnpm --filter @cortex-work/desktop run build:mac-arm64
          fi

      # 仅签名档校验签名/公证(未签名包跑 codesign 必失败);在仓库外副本上做,规避仓库 node_modules 假通过。
      - name: Verify signed app and dmg (outside repo)
        if: ${{ env.MODE != 'build-unsigned' }}
        run: |
          src="apps/desktop/dist/mac-arm64"
          work="$(mktemp -d)"
          product_name="$(node -p "require('./apps/desktop/package.json').productName")"
          app="$src/${product_name}.app"
          app_copy="$work/${product_name}.app"
          ditto "$app" "$app_copy"
          codesign --verify --deep --strict --verbose=2 "$app_copy"
          codesign -dv --verbose=4 "$app_copy"
          spctl --assess --type execute --verbose "$app_copy"
          xcrun stapler validate "$app_copy"
          dmg="$(ls -1 apps/desktop/dist/*-arm64.dmg | head -n 1)"
          cp "$dmg" "$work/"
          dmg_copy="$work/$(basename "$dmg")"
          # dmg 为人工分发容器:app 已签名+公证+staple(上面是硬门)。dmg 本身是否独立签名/公证取决于
          # electron-builder(它公证的是 app),故下面两条仅信息性报告,不因 dmg 无独立签名/票据而 fail 构建。
          spctl --assess --type open --context context:primary-signature --verbose "$dmg_copy" \
            || echo "DMG 无独立代码签名/公证 — 可接受(挂载后 app 已公证,Gatekeeper 认 app)。"
          xcrun stapler validate "$dmg_copy" \
            || echo "DMG 无 stapled ticket — 可接受(app ticket 已 staple)。"

      # latest-mac.yml 重命名为 latest-mac-arm64.yml,供 publish job 与 x64 清单合并。
      - name: Rename manifest for release transfer
        run: cp apps/desktop/dist/latest-mac.yml apps/desktop/dist/latest-mac-arm64.yml

      - name: Upload workflow artifact
        if: ${{ !contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), env.MODE) }}
        uses: actions/upload-artifact@v7
        with:
          name: cortex-desktop-${{ env.BUILD_TAG }}-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*-arm64.dmg
            apps/desktop/dist/*-arm64.dmg.blockmap
            apps/desktop/dist/*-arm64.zip
            apps/desktop/dist/*-arm64.zip.blockmap
            apps/desktop/dist/latest-mac-arm64.yml
            apps/desktop/build/release-notes.md

      - name: Upload assets directly to draft release
        if: ${{ contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), env.MODE) }}
        env:
          GH_TOKEN: ${{ env.MODE == 'publish-self' && secrets.GITHUB_TOKEN || secrets.RELEASE_GH_TOKEN }}
          RELEASE_REPO: ${{ needs.prepare-release.outputs.target_repo }}
        run: |
          shopt -s nullglob
          assets=(
            apps/desktop/dist/*-arm64.dmg
            apps/desktop/dist/*-arm64.dmg.blockmap
            apps/desktop/dist/*-arm64.zip
            apps/desktop/dist/*-arm64.zip.blockmap
            apps/desktop/dist/latest-mac-arm64.yml
          )
          (( ${#assets[@]} == 5 )) || { echo "Expected 5 arm64 release assets, got ${#assets[@]}" >&2; exit 1; }
          gh release upload "$BUILD_TAG" --repo "$RELEASE_REPO" --clobber "${assets[@]}"

  build-macos-x64:
    name: Build (sign/publish per mode) — macOS x64
    needs: prepare-release
    # arm64 硬件上交叉产出 x64:node-pty 自带 darwin-x64 prebuilds、pi 用 bun --target bun-darwin-x64
    # 交叉编译,故不需要真正的 Intel runner。
    runs-on: macos-15
    timeout-minutes: 60
    environment: production-release
    env:
      MODE: ${{ (github.event_name == 'push' && 'publish-release') || github.event.inputs.mode || 'build-unsigned' }}
      BUILD_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Verify secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          case "$MODE" in
            build-unsigned)            required="" ;;
            build-signed|publish-self) required="APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD" ;;
            *)                         required="APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD RELEASE_GH_TOKEN" ;;
          esac
          if [[ -z "$required" ]]; then
            echo "mode=$MODE:无需 secret"
            exit 0
          fi
          missing=()
          for name in $required; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secrets for mode=$MODE: ${missing[*]}" >&2
            exit 1
          fi
          echo "Secrets OK for mode=$MODE"

      - name: Assert tag matches package.json version
        if: github.event_name == 'push'
        run: |
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "Tag ($tag_version) does not match apps/desktop/package.json version ($pkg_version)" >&2
            exit 1
          fi
          echo "Version match: $pkg_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # x64 包不含本地 Whisper 功能(prepare-whisper-runner.mjs v1 仅支持 darwin-arm64,
      # before-pack.cjs 已对此优雅降级、只告警不阻断),这是已知可接受的功能差异。
      - name: Prepackage (build pi binary + renderer/main, arch=x64)
        env:
          CORTEX_NOTES_STRICT: ${{ env.MODE == 'publish-release' && '1' || '' }}
        run: pnpm --filter @cortex-work/desktop run prepackage:mac-x64

      - name: Build (and sign per mode)
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: "Jiangwei Lan (HQ537XMLJY)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ "$MODE" == "build-unsigned" ]]; then
            echo "build-unsigned:构建未签名包(验证构建链,无需 secret)"
            pnpm --filter @cortex-work/desktop run build:mac-x64 -- -c.mac.identity=null -c.mac.notarize=false
          else
            echo "mode=$MODE:构建 + 签名 + 公证"
            pnpm --filter @cortex-work/desktop run build:mac-x64
          fi

      # x64 的 electron-builder 默认输出目录是 dist/mac(不是 dist/mac-arm64),
      # 与 arm64 job 的路径不同,校验步骤必须分别指向各自目录。
      - name: Verify signed app and dmg (outside repo)
        if: ${{ env.MODE != 'build-unsigned' }}
        run: |
          src="apps/desktop/dist/mac"
          work="$(mktemp -d)"
          product_name="$(node -p "require('./apps/desktop/package.json').productName")"
          app="$src/${product_name}.app"
          app_copy="$work/${product_name}.app"
          ditto "$app" "$app_copy"
          codesign --verify --deep --strict --verbose=2 "$app_copy"
          codesign -dv --verbose=4 "$app_copy"
          spctl --assess --type execute --verbose "$app_copy"
          xcrun stapler validate "$app_copy"
          dmg="$(ls -1 apps/desktop/dist/*-x64.dmg | head -n 1)"
          cp "$dmg" "$work/"
          dmg_copy="$work/$(basename "$dmg")"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg_copy" \
            || echo "DMG 无独立代码签名/公证 — 可接受(挂载后 app 已公证,Gatekeeper 认 app)。"
          xcrun stapler validate "$dmg_copy" \
            || echo "DMG 无 stapled ticket — 可接受(app ticket 已 staple)。"

      - name: Rename manifest for release transfer
        run: cp apps/desktop/dist/latest-mac.yml apps/desktop/dist/latest-mac-x64.yml

      - name: Upload workflow artifact
        if: ${{ !contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), env.MODE) }}
        uses: actions/upload-artifact@v7
        with:
          name: cortex-desktop-${{ env.BUILD_TAG }}-macos-x64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*-x64.dmg
            apps/desktop/dist/*-x64.dmg.blockmap
            apps/desktop/dist/*-x64.zip
            apps/desktop/dist/*-x64.zip.blockmap
            apps/desktop/dist/latest-mac-x64.yml

      - name: Upload assets directly to draft release
        if: ${{ contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), env.MODE) }}
        env:
          GH_TOKEN: ${{ env.MODE == 'publish-self' && secrets.GITHUB_TOKEN || secrets.RELEASE_GH_TOKEN }}
          RELEASE_REPO: ${{ needs.prepare-release.outputs.target_repo }}
        run: |
          shopt -s nullglob
          assets=(
            apps/desktop/dist/*-x64.dmg
            apps/desktop/dist/*-x64.dmg.blockmap
            apps/desktop/dist/*-x64.zip
            apps/desktop/dist/*-x64.zip.blockmap
            apps/desktop/dist/latest-mac-x64.yml
          )
          (( ${#assets[@]} == 5 )) || { echo "Expected 5 x64 release assets, got ${#assets[@]}" >&2; exit 1; }
          gh release upload "$BUILD_TAG" --repo "$RELEASE_REPO" --clobber "${assets[@]}"

  build-windows-x64:
    name: Build — Windows x64
    needs: prepare-release
    runs-on: windows-latest
    timeout-minutes: 60
    # 不签名(CSC_IDENTITY_AUTO_DISCOVERY=false 现状不变),但正式跨库发布需要从受保护
    # production-release environment 读取 RELEASE_GH_TOKEN,将产物直接传入 draft Release。
    environment: production-release
    env:
      MODE: ${{ (github.event_name == 'push' && 'publish-release') || github.event.inputs.mode || 'build-unsigned' }}
      BUILD_TAG: ${{ github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Assert tag matches package.json version
        if: github.event_name == 'push'
        shell: bash
        run: |
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "Tag ($tag_version) does not match apps/desktop/package.json version ($pkg_version)" >&2
            exit 1
          fi
          echo "Version match: $pkg_version"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Windows 包同样没有本地 Whisper 功能(v1 仅支持 darwin-arm64),已知可接受降级。
      - name: Prepackage (build pi binary + renderer/main, arch=win32-x64)
        run: pnpm --filter @cortex-work/desktop run prepackage:win-x64

      - name: Build (unsigned)
        run: pnpm --filter @cortex-work/desktop run build:win-x64

      - name: Upload workflow artifact
        if: ${{ !contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), env.MODE) }}
        uses: actions/upload-artifact@v7
        with:
          name: cortex-desktop-${{ env.BUILD_TAG }}-windows-x64
          if-no-files-found: error
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml

      - name: Upload assets directly to draft release
        if: ${{ contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), env.MODE) }}
        shell: bash
        env:
          GH_TOKEN: ${{ env.MODE == 'publish-self' && secrets.GITHUB_TOKEN || secrets.RELEASE_GH_TOKEN }}
          RELEASE_REPO: ${{ needs.prepare-release.outputs.target_repo }}
        run: |
          shopt -s nullglob
          assets=(
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.exe.blockmap
            apps/desktop/dist/latest.yml
          )
          (( ${#assets[@]} == 3 )) || { echo "Expected 3 Windows release assets, got ${#assets[@]}" >&2; exit 1; }
          gh release upload "$BUILD_TAG" --repo "$RELEASE_REPO" --clobber "${assets[@]}"

  publish:
    name: Publish merged release (macOS arm64 + x64, Windows x64)
    needs: [prepare-release, build-macos-arm64, build-macos-x64, build-windows-x64]
    if: ${{ contains(fromJSON('["publish-self", "publish-draft", "publish-release"]'), (github.event_name == 'push' && 'publish-release') || github.event.inputs.mode || 'build-unsigned') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-release
    env:
      MODE: ${{ (github.event_name == 'push' && 'publish-release') || github.event.inputs.mode || 'build-unsigned' }}
      BUILD_TAG: ${{ github.ref_name }}
      RELEASE_REPO: ${{ needs.prepare-release.outputs.target_repo }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm

      # 只为跑 merge-mac-update-manifest.mjs(依赖 js-yaml),不需要构建工具链。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate strict release notes
        env:
          CORTEX_NOTES_STRICT: "1"
        run: pnpm --filter @cortex-work/desktop run prebuild:notes

      - name: Download release manifests
        env:
          GH_TOKEN: ${{ env.MODE == 'publish-self' && secrets.GITHUB_TOKEN || secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          arm_dir="artifacts/cortex-desktop-${BUILD_TAG}-macos-arm64"
          x64_dir="artifacts/cortex-desktop-${BUILD_TAG}-macos-x64"
          mkdir -p "$arm_dir" "$x64_dir"
          gh release download "$BUILD_TAG" --repo "$RELEASE_REPO" \
            --pattern latest-mac-arm64.yml --dir "$arm_dir"
          gh release download "$BUILD_TAG" --repo "$RELEASE_REPO" \
            --pattern latest-mac-x64.yml --dir "$x64_dir"

      # 第一道护栏:merge 脚本内置断言,任一份清单"名不副实"或合并结果非双架构直接 abort。
      - name: Merge macOS update manifests (arm64 + x64)
        run: |
          mkdir -p staging
          node apps/desktop/scripts/merge-mac-update-manifest.mjs \
            --arm64 "artifacts/cortex-desktop-${BUILD_TAG}-macos-arm64/latest-mac-arm64.yml" \
            --x64 "artifacts/cortex-desktop-${BUILD_TAG}-macos-x64/latest-mac-x64.yml" \
            --out staging/latest-mac.yml

      # 第二道护栏(独立复核):重新解析即将上传的最终清单,复用同一份断言逻辑,
      # 防止 staging 目录被手动改动或误放入单架构文件。
      - name: Verify merged manifest is multi-arch (independent guard)
        run: node apps/desktop/scripts/merge-mac-update-manifest.mjs --verify staging/latest-mac.yml

      - name: Verify draft release asset inventory
        env:
          GH_TOKEN: ${{ env.MODE == 'publish-self' && secrets.GITHUB_TOKEN || secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$BUILD_TAG" --repo "$RELEASE_REPO" \
            --json assets --jq '.assets[].name' > release-assets.txt

          required_patterns=(
            '.*-arm64\.dmg$'
            '.*-arm64\.dmg\.blockmap$'
            '.*-arm64\.zip$'
            '.*-arm64\.zip\.blockmap$'
            '.*-x64\.dmg$'
            '.*-x64\.dmg\.blockmap$'
            '.*-x64\.zip$'
            '.*-x64\.zip\.blockmap$'
            '.*\.exe$'
            '.*\.exe\.blockmap$'
            '^latest\.yml$'
            '^latest-mac-arm64\.yml$'
            '^latest-mac-x64\.yml$'
          )
          for pattern in "${required_patterns[@]}"; do
            if ! grep -Eq "$pattern" release-assets.txt; then
              echo "Missing release asset matching: $pattern" >&2
              exit 1
            fi
          done
          echo "Draft release assets:"
          cat release-assets.txt

      - name: Finalize GitHub release
        env:
          GH_TOKEN: ${{ env.MODE == 'publish-self' && secrets.GITHUB_TOKEN || secrets.RELEASE_GH_TOKEN }}
        run: |
          set -euo pipefail
          notes_file="apps/desktop/build/release-notes.md"
          gh release upload "$BUILD_TAG" --repo "$RELEASE_REPO" --clobber staging/latest-mac.yml
          gh release edit "$BUILD_TAG" --repo "$RELEASE_REPO" \
            --title "${BUILD_TAG#v}" --notes-file "$notes_file"

          # 两份单架构清单只用于流水线内部合并，最终 Release 仅保留双架构 latest-mac.yml。
          release_id="$(gh api "repos/$RELEASE_REPO/releases/tags/$BUILD_TAG" --jq '.id')"
          for name in latest-mac-arm64.yml latest-mac-x64.yml; do
            asset_id="$(gh api "repos/$RELEASE_REPO/releases/$release_id/assets" \
              --jq ".[] | select(.name == \"$name\") | .id")"
            [[ -n "$asset_id" ]] || { echo "Missing temporary manifest: $name" >&2; exit 1; }
            gh api --method DELETE "repos/$RELEASE_REPO/releases/assets/$asset_id"
          done

          if [[ "$MODE" != "publish-draft" ]]; then
            gh release edit "$BUILD_TAG" --repo "$RELEASE_REPO" --draft=false --latest
          fi
