name: Desktop Release

# 私有库打 v<version> tag(或手动 dispatch)→ 在 macOS 上构建 + Developer ID 签名 + Apple 公证,
# 再用 electron-builder --publish always 跨库发到公开库 rambocode/cortex-desktop(由
# apps/desktop/electron-builder.yml 的 publish 字段决定),供 electron-updater 匿名读取自动升级。
# 设计见 docs/plans/2026-06-16-002-feat-desktop-release-automation-plan.md。

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "release 类型(首批建议 draft 做软门控:人工核对+真机闭环后再 publish;稳定后用 release)"
        type: choice
        options:
          - draft
          - release
        default: draft
  push:
    tags:
      - "v*"

# 默认 token 维持最小;跨库写公开库完全靠 RELEASE_GH_TOKEN(PAT),不提权默认 GITHUB_TOKEN。
permissions:
  contents: read

jobs:
  release-macos-arm64:
    name: Build, sign, notarize and publish (macOS arm64)
    # 必须 GitHub-hosted(一次性 VM);禁 self-hosted,否则证书/keychain 跨 job 残留。
    runs-on: macos-15
    timeout-minutes: 60
    # 签名/公证 secret 与 PAT 放在受保护 Environment(配 tag 进入策略;多维护者时再加 required reviewers)。
    environment: production-release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先启用 pnpm,后面 setup-node 的 cache: pnpm 才能解析(pnpm 须先在 PATH)。
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.2 --activate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      # build:pi 用 bun --compile 产出 pi 自包含二进制(resources/pi 被 gitignore,CI 须现场生成)。
      # 固定 bun 版本,避免 pi 二进制因 bun 漂移而不可复现。
      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      # 任何拉取/执行第三方代码的步骤之前,先校验 secret(本步只读非空、不外泄)。
      - name: Verify release secrets
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        run: |
          missing=()
          for name in APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID CSC_LINK CSC_KEY_PASSWORD RELEASE_GH_TOKEN; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            echo "Missing required secrets: ${missing[*]}" >&2
            exit 1
          fi

      # tag 与 apps/desktop/package.json version 必须一致,否则 latest-mac.yml 版本错位、自动更新失效。
      # workflow_dispatch(无 tag)时跳过。
      - name: Assert tag matches package.json version
        if: github.event_name == 'push'
        run: |
          pkg_version="$(node -p "require('./apps/desktop/package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$pkg_version" != "$tag_version" ]]; then
            echo "Tag ($tag_version) does not match apps/desktop/package.json version ($pkg_version)" >&2
            exit 1
          fi
          echo "Version match: $pkg_version"

      # —— 无密钥步:安装依赖 + 预构建(build:pi 的 bun 编译 + electron-vite),不注入任何 secret。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepackage (build pi binary + renderer/main)
        run: pnpm --filter @cortex-work/desktop run prepackage:mac

      # —— 密钥步:仅此步注入签名/公证凭据与 PAT。electron-builder 从已构建的 out/ 打包,
      # npmRebuild: false 使其不在本步跑 node-gyp 原生编译,故 PAT/证书不接触第三方编译。
      - name: Build, sign, notarize and publish
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_NAME: "Jiangwei Lan (HQ537XMLJY)"
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
          # dispatch 时按所选类型覆盖 releaseType(首批 draft);tag 触发为空,用 yml 的 release。
          RELEASE_TYPE_INPUT: ${{ github.event.inputs.release_type }}
        run: |
          extra=""
          if [[ -n "$RELEASE_TYPE_INPUT" ]]; then
            extra="-c.publish.releaseType=$RELEASE_TYPE_INPUT"
          fi
          pnpm --filter @cortex-work/desktop run release:mac -- $extra

      # 在仓库外副本上校验签名/公证,规避仓库 node_modules 兜底造成的假通过(docs/lessons.md)。
      - name: Verify signed app and dmg (outside repo)
        run: |
          src="apps/desktop/dist"
          work="$(mktemp -d)"
          ditto "$src/mac-arm64/Cortex Desktop.app" "$work/Cortex Desktop.app"
          codesign --verify --deep --strict --verbose=2 "$work/Cortex Desktop.app"
          codesign -dv --verbose=4 "$work/Cortex Desktop.app"
          spctl --assess --type execute --verbose "$work/Cortex Desktop.app"
          xcrun stapler validate "$work/Cortex Desktop.app"
          dmg="$(ls -1 "$src"/Cortex\ Desktop-*-arm64.dmg | head -n 1)"
          cp "$dmg" "$work/"
          dmg_copy="$work/$(basename "$dmg")"
          spctl --assess --type open --context context:primary-signature --verbose "$dmg_copy"
          xcrun stapler validate "$dmg_copy" || echo "DMG 无 stapled ticket;app ticket 校验已通过。"

      # 冗余备份:发布主路径是 electron-builder --publish always;这里留一份 CI artifact 便于排查。
      - name: Upload artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: cortex-desktop-macos-arm64
          if-no-files-found: error
          path: |
            apps/desktop/dist/Cortex Desktop-*-arm64.dmg
            apps/desktop/dist/Cortex Desktop-*-arm64.dmg.blockmap
            apps/desktop/dist/Cortex Desktop-*-arm64-mac.zip
            apps/desktop/dist/Cortex Desktop-*-arm64-mac.zip.blockmap
            apps/desktop/dist/latest-mac.yml
